<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head><script id="auth-flicker-guard">(function(){try{var p=location.pathname.toLowerCase();if(p.endsWith('/login.html')||p==='/'||p===''){return;}if(!localStorage.getItem('token')||!localStorage.getItem('user')){location.replace('login.html');return;}document.documentElement.classList.add('auth-loading');}catch(e){location.replace('login.html');}})();</script><style id="auth-flicker-style">html.auth-loading body{visibility:hidden!important}html.auth-ready body{visibility:visible}</style>
<meta charset="UTF-8"><title>إعدادات السيستم</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#172033;--text:#f8fafc;--muted:#94a3b8;--cyan:#22d3ee;--border:#334155;--green:#4ade80;--red:#fb7185;--warn:#fbbf24;--dark:#0b1220}*{box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:22px}.wrap{max-width:1680px;margin:auto}.header,.panel,.side{background:var(--panel);border:1px solid var(--border);border-radius:18px}.header{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.muted{color:var(--muted);line-height:1.75}.hint{padding:10px 12px;background:var(--dark);border:1px solid var(--border);border-radius:12px;color:#cbd5e1}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}.side{padding:14px;position:sticky;top:16px;align-self:start}.tab{width:100%;text-align:right;margin:0 0 8px;background:var(--dark);color:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer}.tab.active{background:var(--cyan);color:#05202a}.tab small{display:block;margin-top:5px;opacity:.8}.panel{padding:16px;margin-bottom:16px}.section-title{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:end}label{display:block;color:#cbd5e1;margin-bottom:6px;font-size:13px}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--dark);color:#fff}textarea{resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}a.btn,button{background:var(--cyan);color:#05202a;text-decoration:none;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}button.dark,a.dark{background:var(--dark);color:#fff;border:1px solid var(--border)}button.red{background:var(--red);color:#111827}button.ghost{background:transparent;color:#cbd5e1;border:1px dashed var(--border)}table{width:100%;border-collapse:collapse;background:#111827;border-radius:14px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:center;vertical-align:top}th{background:var(--dark);color:#67e8f9}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px}.pill{display:inline-block;padding:5px 9px;border:1px solid var(--border);background:var(--dark);border-radius:999px;color:#cbd5e1;font-size:12px}.ok{color:var(--green)}.off{color:var(--red)}.warn{color:var(--warn)}.card{background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:14px}.catalog-card{margin-bottom:14px}.catalog-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.hidden{display:none!important}.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}.stat{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px}.stat b{font-size:20px;color:#67e8f9}.mini-search{max-width:280px}.edit-box{border:1px solid #155e75;background:#082f49;border-radius:16px;padding:14px;margin-bottom:16px}.bosta-note{border:1px solid #854d0e;background:#422006;color:#fde68a;border-radius:14px;padding:12px;margin:8px 0 14px}.health-modal{position:fixed;inset:0;z-index:3000;background:rgba(2,6,23,.82);display:flex;align-items:center;justify-content:center;padding:18px}.health-modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid #475569;border-radius:20px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.55)}.health-modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.health-order-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:12px 0}.health-order-summary>div{background:var(--dark);border:1px solid var(--border);border-radius:12px;padding:10px}.health-preview{margin-top:14px;border:1px solid #155e75;background:#082f49;border-radius:14px;padding:13px;line-height:1.9}.health-warning{margin-top:8px;padding:8px 10px;background:#422006;border:1px solid #854d0e;color:#fde68a;border-radius:10px}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.health-modal{padding:8px}.health-modal-card{padding:13px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div><h1 style="margin:0">⚙️ إعدادات السيستم وقاعدة البيانات</h1><div class="muted">كل جزء منفصل لوحده: الأمان، الخامات، الحسابات، وبوسطة. أي اسم بيتغير هنا يظهر في السيستم بدون تعديل كود.</div></div>
    <div class="actions"><a class="btn dark" href="index.html">🏠 الرئيسية</a><button onclick="loadAll()">تحديث</button></div>
  </div>

  <div class="stat-row" id="summaryStats"></div>

  <div class="layout">
    <aside class="side">
      <button class="tab active" data-section="security" onclick="setSection('security')">🔐 الدخول والأمان<small>تايم أوت وموقع الجهاز</small></button>
      <button class="tab" data-section="health" onclick="setSection('health')">🧪 فحص وربط السيستم<small>الحسابات، المخازن، الأوردرات، النسخ الاحتياطي</small></button>
      <button class="tab" data-section="storelink" onclick="setSection('storelink')">🔗 ربط موقع البيع<small>الحالة، المفتاح والمزامنة</small></button>
      <button class="tab" data-section="mobileapp" onclick="setSection('mobileapp')">📱 تطبيق الموبايل<small>لينك تحميل الـ APK</small></button>
      <button class="tab" data-section="orders" onclick="setSection('orders')">🛍️ الأوردر والخامات<small>ورق، يد، طباعة، حالات</small></button>
      <button class="tab" data-section="pricing" onclick="setSection('pricing')">💵 الأسعار والتكاليف<small>طباعة، زنكات، تصنيع، قص، مقاسات الفرخ</small></button>
      <button class="tab" data-section="accounts" onclick="setSection('accounts')">💰 الحسابات والشركاء<small>تصنيفات مصروفات وأنواع شركاء</small></button>
      <button class="tab" data-section="bosta" onclick="setSection('bosta')">🚚 بوسطة<small>محافظات ومناطق عربي + أكواد</small></button>
      <button class="tab" data-section="all" onclick="setSection('all')">📚 كل القوائم<small>عرض شامل لكل الإعدادات</small></button>
    </aside>

    <main>
      <div id="editBox" class="edit-box hidden">
        <div class="section-title"><div><h3 id="editTitle" style="margin:0">إضافة عنصر</h3><div class="muted" id="editSub"></div></div><button class="dark" onclick="hideItemForm()">إغلاق</button></div>
        <input id="itemId" type="hidden"><input id="itemType" type="hidden">
        <div class="form-grid">
          <div><label>الاسم الظاهر في السيستم</label><input id="itemName" placeholder="مثال: مدينة نصر / كرافت / جاهز للشحن"></div>
          <div><label>الكود/القيمة الخارجية</label><input id="itemCode" placeholder="اختياري — مهم في بوسطة لو عندك كود"></div>
          <div><label>ترتيب الظهور</label><input id="itemSort" type="number" value="0"></div>
          <div><label>الحالة</label><select id="itemActive"><option value="1">نشط</option><option value="0">موقوف</option></select></div>
          <div style="grid-column:1/-1"><label>بيانات إضافية JSON</label><textarea id="itemExtra" rows="2" placeholder='اختياري مثال: {"note":"..."}'></textarea></div>
          <div class="actions" style="grid-column:1/-1"><button onclick="saveItem()">حفظ</button><button class="dark" onclick="hideItemForm()">إلغاء</button></div>
        </div>
      </div>

      <div id="content"></div>
    </main>
  </div>
</div>
<div id="healthPaperModal" class="health-modal hidden" onclick="if(event.target===this)closeHealthPaperRepair()">
  <div class="health-modal-card">
    <div class="health-modal-head">
      <div><h2 style="margin:0">🧾 إصلاح خصم الورق</h2><div id="healthPaperModalSub" class="muted">اختار الورق وطريقة القص والعدد الفعلي.</div></div>
      <button class="dark" onclick="closeHealthPaperRepair()">إغلاق</button>
    </div>
    <div id="healthPaperLoad" class="hint">جاري تحميل بيانات الأوردر والمخزن...</div>
    <div id="healthPaperForm" class="hidden">
      <div id="healthPaperOrderSummary" class="health-order-summary"></div>
      <div class="form-grid">
        <div><label>صنف الورق الذي تم قصه فعليًا</label><select id="healthPaperSelect" onchange="healthPaperChanged()"></select></div>
        <div><label>طريقة القص الفعلية</label><select id="healthPaperLayout" onchange="healthPaperLayoutChanged()"></select></div>
        <div><label>عدد الأفرخ الفعلي</label><input id="healthPaperSheets" type="number" min="1" step="1" oninput="renderHealthPaperPreview()"></div>
      </div>
      <div id="healthPaperPreview" class="health-preview"></div>
      <div class="actions" style="margin-top:14px"><button id="healthPaperSave" onclick="submitHealthPaperRepair()">تأكيد الإصلاح والخصم</button><button class="dark" onclick="closeHealthPaperRepair()">إلغاء</button></div>
    </div>
  </div>
</div>
<script>
const token=localStorage.getItem('token');
const user=JSON.parse(localStorage.getItem('user')||'null');
if(!token||!user) location.href='login.html';
function isSuper(){return user.username==='admin'||user.role==='super_admin';}
function hasPerm(k){return isSuper()||Number(user[k]||0)===1;}
if(!hasPerm('perm_system_config')) location.href='index.html';
let data={settings:[],catalogs:[],active_users:[]};
let activeSection='security';
const catalogLabels={paper_types:'أنواع الورق',handle_types:'أنواع اليد',print_types:'أنواع الطباعة',lamination_types:'أنواع السلوفان/التغليف',order_statuses:'حالات الأوردر',expense_categories:'تصنيفات المصاريف',partner_account_types:'أنواع حساب الشريك',bosta_governorates:'محافظات بوسطة'};
// كل قسم بيعرض القوائم بتاعته (types) والإعدادات الرقمية بتاعته (settings = تصنيفات app_settings).
// null معناها «اعرض كل حاجة».
const sectionInfo={
  security:{title:'الدخول والأمان',desc:'إعدادات القفل التلقائي وتسجيل اللوكيشن في سجل الأدمن.',types:[],settings:['الأمان']},
  health:{title:'فحص وربط السيستم',desc:'صفحة مراجعة سريعة للحسابات وخصومات المخازن والربط بين الأوردرات والصنايعية والخزنة والنسخ الاحتياطية.',types:[],settings:['النسخ الاحتياطي']},
  storelink:{title:'ربط موقع البيع',desc:'مكان واحد فقط لمتابعة الربط بين موقع البيع وسيستم المصنع وتشغيل المزامنة أو تعديل إعداداتها.',types:[],settings:['الربط مع موقع البيع']},
  mobileapp:{title:'تطبيق الموبايل',desc:'لينك تحميل الـ APK اللي بيفتح من زرار «تحميل التطبيق» في لوحة التحكم. غيّر اللينك هنا وأي إصدار جديد يشتغل فورًا من غير ما ترفع المشروع.',types:[],settings:[]},
  orders:{title:'الأوردر والخامات',desc:'كل الاختيارات التي تظهر أثناء إنشاء الأوردر أو إدارة المخزون.',types:['paper_types','handle_types','print_types','lamination_types','order_statuses'],settings:[]},
  pricing:{title:'الأسعار والتكاليف',desc:'كل رقم بيحسب بيه السيستم التكلفة: الطباعة والزنكات والتصنيع واليد والقص ومراحل التشغيل وحدود ربع/نص/فرخ وزيادة كسر السلاح. أي تعديل هنا بيسري على السيستم والتطبيق على طول.',types:[],settings:['تكاليف مراحل التشغيل','مقاسات القص والتشغيل','أسعار الطباعة والزنكات','تكاليف التصنيع واليد','أسعار الورق الافتراضية']},
  accounts:{title:'الحسابات والشركاء',desc:'اختيارات المصاريف وأنواع حسابات الشركاء.',types:['expense_categories','partner_account_types'],settings:[]},
  bosta:{title:'بوسطة',desc:'المحافظات والمناطق تظهر عربي في السيستم، والكود الخارجي يظل موجود للإرسال لبوسطة.',types:['bosta_governorates'],settings:['بوسطة']},
  all:{title:'كل القوائم',desc:'عرض شامل لكل عناصر وإعدادات السيستم في مكان واحد.',types:null,settings:null}
};
function $(id){return document.getElementById(id);}
function authFetch(url,opts={}){opts.headers=Object.assign({},opts.headers||{},{Authorization:'Bearer '+token});return fetch(url,opts).then(async r=>{const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.clear();location.href='login.html';throw new Error('unauthorized')}if(!r.ok)throw new Error(d.error||'error');return d;});}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function decodeType(t){return String(t||'').replace(/^bosta_zones:/,'');}
function labelType(t){if(String(t).startsWith('bosta_zones:')) return 'مناطق بوسطة — '+decodeType(t); return catalogLabels[t]||t;}
function activeCatalogs(){return data.catalogs||[];}
function catalogsByType(type){return activeCatalogs().filter(i=>i.catalog_type===type).sort((a,b)=>Number(a.sort_order||0)-Number(b.sort_order||0)||String(a.name||'').localeCompare(String(b.name||''),'ar'));}
function settingByKey(key){return (data.settings||[]).find(s=>String(s.setting_key)===String(key))||{};}
function groupSettings(){const groups={};(data.settings||[]).forEach(s=>{const c=s.category||'عام';(groups[c]=groups[c]||[]).push(s);});return groups;}
function renderStats(){
  const allTypes=[...new Set(activeCatalogs().map(x=>x.catalog_type))];
  const zones=activeCatalogs().filter(x=>String(x.catalog_type).startsWith('bosta_zones:')).length;
  $('summaryStats').innerHTML=`<div class="stat"><span class="muted">إعدادات عامة</span><br><b>${(data.settings||[]).length}</b></div><div class="stat"><span class="muted">قوائم منفصلة</span><br><b>${allTypes.length}</b></div><div class="stat"><span class="muted">مناطق بوسطة</span><br><b>${zones}</b></div><div class="stat"><span class="muted">مستخدمين نشطين</span><br><b>${(data.active_users||[]).length}</b></div>`;
}
function setSection(section){activeSection=section;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.section===section));hideItemForm();renderContent();if(section==='storelink'&&!storeLinkStatus)loadStoreLinkStatus();if(section==='mobileapp'&&!appLinkStatus)loadAppLink();}
function renderSettingsPanel(categories){
  const groups=groupSettings();
  const wanted=Array.isArray(categories)?categories:null;
  const entries=Object.entries(groups).filter(([cat])=>!wanted||wanted.includes(cat));
  if(!entries.length) return '';
  const cards=entries.map(([cat,rows])=>`<div class="card"><h3 style="margin-top:0">${esc(cat)}</h3>${rows.map(s=>settingControl(s)).join('')}</div>`).join('');
  return `<div class="panel"><div class="section-title"><div><h2 style="margin:0">إعدادات عامة</h2><div class="muted">أي رقم هنا بيتطبق فورًا على السيستم والتطبيق. أقل قفل خمول مسموح 60 ثانية.</div></div><span class="pill">صلاحية إعدادات السيستم</span></div><div class="grid">${cards}</div></div>`;
}
function settingControl(s){
  const key=String(s.setting_key||'');
  const val=String(s.setting_value??'');
  if(key==='location_tracking_enabled'){
    return `<div style="margin-top:12px"><label>${esc(s.label||key)}</label><select id="setting_${esc(key)}"><option value="1" ${val==='1'?'selected':''}>مفعل — اطلب اللوكيشن</option><option value="0" ${val==='0'?'selected':''}>موقوف</option></select><small class="muted">${esc(key)}</small><div class="actions" style="margin-top:8px"><button onclick="saveSetting('${esc(key)}')">حفظ</button></div></div>`;
  }
  return `<div style="margin-top:12px"><label>${esc(s.label||key)}</label><input id="setting_${esc(key)}" value="${esc(val)}"><small class="muted">${esc(key)}</small><div class="actions" style="margin-top:8px"><button onclick="saveSetting('${esc(key)}')">حفظ</button></div></div>`;
}
function zoneTypes(){return [...new Set(activeCatalogs().map(i=>i.catalog_type).filter(t=>String(t).startsWith('bosta_zones:')))].sort((a,b)=>labelType(a).localeCompare(labelType(b),'ar'));}
function typesForCurrentSection(){
  if(activeSection==='all') return [...new Set(activeCatalogs().map(i=>i.catalog_type))].sort((a,b)=>labelType(a).localeCompare(labelType(b),'ar'));
  if(activeSection==='bosta') return ['bosta_governorates',...zoneTypes()];
  return sectionInfo[activeSection]?.types || [];
}
function renderCatalogCard(type){
  const rows=catalogsByType(type);
  const codeHint=String(type).startsWith('bosta_')?'الكود/القيمة الخارجية تستخدم مع بوسطة. الاسم هو العربي الظاهر عندك.':'الكود اختياري لو الاختيار له قيمة داخلية.';
  return `<div class="panel catalog-card" id="card_${esc(type).replace(/[^\w\u0600-\u06FF-]/g,'_')}"><div class="catalog-head"><div><h3 style="margin:0">${esc(labelType(type))}</h3><div class="muted">${esc(codeHint)}</div></div><div class="actions"><input class="mini-search" id="search_${safeId(type)}" placeholder="بحث داخل القائمة" oninput="renderContent()" value="${esc(searchValue(type))}"><button onclick="startNewItem('${esc(type)}')">+ إضافة</button></div></div>${catalogTable(type,rows)}</div>`;
}
function safeId(t){return String(t).replace(/[^a-zA-Z0-9_\-\u0600-\u06FF]/g,'_');}
function searchValue(type){const el=$('search_'+safeId(type));return el?el.value:'';}
function filteredRows(type,rows){const q=String(searchValue(type)||'').trim().toLowerCase();if(!q)return rows;return rows.filter(r=>String(r.name||'').toLowerCase().includes(q)||String(r.code||'').toLowerCase().includes(q)||String(r.extra_json||'').toLowerCase().includes(q));}
function catalogTable(type,rows){
  const filtered=filteredRows(type,rows);
  return `<div class="table-wrap"><table><thead><tr><th>الاسم العربي</th><th>الكود/القيمة</th><th>ترتيب</th><th>حالة</th><th>بيانات إضافية</th><th>آخر تعديل</th><th>تحكم</th></tr></thead><tbody>${filtered.length?filtered.map(r=>`<tr><td><b>${esc(r.name)}</b><br><small class="muted">#${Number(r.id)}</small></td><td>${esc(r.code||'-')}</td><td>${Number(r.sort_order||0)}</td><td>${Number(r.is_active||0)?'<span class="ok">نشط</span>':'<span class="off">موقوف</span>'}</td><td><small class="muted">${esc(r.extra_json||'-')}</small></td><td><small class="muted">${esc(r.updated_by||'-')}</small></td><td><div class="actions"><button class="dark" onclick="editItem(${Number(r.id)})">تعديل</button><button class="red" onclick="deleteItem(${Number(r.id)})">إيقاف</button></div></td></tr>`).join(''):`<tr><td colspan="7">لا توجد عناصر في ${esc(labelType(type))}</td></tr>`}</tbody></table></div>`;
}
function renderBostaIntro(){
  if(activeSection!=='bosta') return '';
  const govs=catalogsByType('bosta_governorates');
  return `<div class="bosta-note"><b>طريقة بوسطة الجديدة:</b> اختار المحافظة، بعدها السيستم يعرض مناطق المحافظة فقط. المنطقة تظهر عربي في السيستم، ويتبعت لبوسطة الكود/القيمة المحفوظة في خانة الكود. لو الكود فاضي، يستخدم الاسم كقيمة احتياطية.</div><div class="panel"><div class="section-title"><div><h3 style="margin:0">إضافة قائمة مناطق لمحافظة</h3><div class="muted">لو ضفت محافظة جديدة ومفيش لها كارت مناطق، اختارها واضغط إنشاء.</div></div></div><div class="form-grid"><div><label>المحافظة</label><select id="newZoneGov">${govs.map(g=>`<option value="${esc(g.name)}">${esc(g.name)}${g.code?` — ${esc(g.code)}`:''}</option>`).join('')||'<option value="">لا توجد محافظات</option>'}</select></div><div class="actions"><button class="dark" onclick="createZoneTypeForGov()">إنشاء/فتح مناطق المحافظة</button></div></div></div>`;
}

function severityLabel(s){return s==='error'?'<span class="off">خطأ</span>':(s==='warn'?'<span class="warn">تحذير</span>':'<span class="ok">معلومة</span>');}
let lastHealth=null;
let healthPaperRepairData=null;
let healthPaperRepairOrderId=0;
let healthPaperRepairSaving=false;
async function runHealthCheck(){

async function runHealthOnly(){

function renderHealthResult(d){

}
function closeHealthPaperRepair(){if(healthPaperRepairSaving)return;$('healthPaperModal').classList.add('hidden');healthPaperRepairData=null;healthPaperRepairOrderId=0;}
function healthPaperUniquePapers(){
  const seen=new Set();return (healthPaperRepairData?.options||[]).filter(o=>{const id=Number(o.paperId||0);if(!id||seen.has(id))return false;seen.add(id);return true;});
}
function currentHealthPaperOption(){
  const paperId=Number($('healthPaperSelect')?.value||0);const layoutKey=$('healthPaperLayout')?.value||'';
  return (healthPaperRepairData?.options||[]).find(o=>Number(o.paperId)===paperId&&o.layoutKey===layoutKey)||null;
}
async function openHealthPaperRepair(orderId){
  healthPaperRepairOrderId=Number(orderId||0);healthPaperRepairData=null;healthPaperRepairSaving=false;
  $('healthPaperModal').classList.remove('hidden');$('healthPaperLoad').classList.remove('hidden');$('healthPaperForm').classList.add('hidden');$('healthPaperLoad').innerHTML='جاري تحميل بيانات الأوردر والمخزن...';

    const d=await authFetch('/system-health-paper-repair/'+healthPaperRepairOrderId);healthPaperRepairData=d;

  }catch(e){$('healthPaperLoad').innerHTML='<span class="off">'+esc(e.message||'تعذر تحميل بيانات الإصلاح')+'</span>';}
}
function healthPaperChanged(preferredLayout=''){
  const paperId=Number($('healthPaperSelect')?.value||0);const layouts=(healthPaperRepairData?.options||[]).filter(o=>Number(o.paperId)===paperId);
  $('healthPaperLayout').innerHTML=layouts.map(o=>`<option value="${esc(o.layoutKey)}" ${preferredLayout===o.layoutKey?'selected':''}>${esc(o.layoutLabel)} — المخطط ${Number(o.neededSheets||0)} فرخ — هالك ${Number(o.wastePercent||0).toFixed(1)}%</option>`).join('');
  healthPaperLayoutChanged();
}
function healthPaperLayoutChanged(){const o=currentHealthPaperOption();if(o)$('healthPaperSheets').value=Math.max(1,Math.round(Number(o.neededSheets||0)));renderHealthPaperPreview();}
function renderHealthPaperPreview(){
  const box=$('healthPaperPreview'),save=$('healthPaperSave'),o=currentHealthPaperOption();if(!box||!save)return;
  const sheets=Math.max(0,Math.round(Number($('healthPaperSheets')?.value||0)));if(!o||sheets<=0){box.innerHTML='<span class="off">اختار الورق والطريقة واكتب عدد الأفرخ الفعلي.</span>';save.disabled=true;return;}
  const kg=sheets*Number(o.sheetWeightKg||0),cost=kg*Number(o.buyPriceKg||0),remaining=Number(o.availableSheets||0)-sheets;
  const noStock=remaining<0;const below=sheets<Number(o.neededSheets||0);const mismatch=!Number(o.matchesOrder||0);const altGram=!Number(o.exactGram||0);
  box.innerHTML=`<div class="grid"><div><small class="muted">الخصم الفعلي</small><br><b>${sheets} فرخ — ${kg.toFixed(3)} كجم</b></div><div><small class="muted">تكلفة الورق</small><br><b>${cost.toFixed(2)} ج</b></div><div><small class="muted">المتبقي بعد الخصم</small><br><b class="${noStock?'off':'ok'}">${remaining} فرخ</b></div><div><small class="muted">المخطط الحسابي</small><br><b>${Number(o.neededSheets||0)} فرخ — هالك ${Number(o.wastePercent||0).toFixed(1)}%</b></div></div>${noStock?'<div class="health-warning off">الرصيد لا يكفي للعدد المكتوب، ولن يسمح السيستم بالخصم.</div>':''}${below?'<div class="health-warning">العدد الفعلي أقل من المخطط. مسموح حفظه بعد التأكيد لأن ده تصحيح لقص تم فعليًا.</div>':''}${mismatch?'<div class="health-warning">صنف الورق مختلف عن النوع أو اللون المسجل على الأوردر. تأكد إنه الورق الذي اتقص فعليًا.</div>':''}${altGram?'<div class="health-warning">جرام الورق مختلف عن الجرام المسجل، وسيتم تحديث الأوردر للجرام الفعلي.</div>':''}`;
  save.disabled=noStock||healthPaperRepairSaving;
}
async function submitHealthPaperRepair(){
  if(healthPaperRepairSaving)return;const o=currentHealthPaperOption();const sheets=Math.max(0,Math.round(Number($('healthPaperSheets')?.value||0)));if(!o||sheets<=0)return alert('اختار الورق والطريقة واكتب عدد الأفرخ الفعلي.');
  const below=sheets<Number(o.neededSheets||0),mismatch=!Number(o.matchesOrder||0);
  if(below&&!confirm(`العدد الفعلي ${sheets} فرخ أقل من المخطط ${Number(o.neededSheets||0)} فرخ. متأكد أن ده العدد الذي اتقص فعليًا؟`))return;
  if(mismatch&&!confirm('الورق المختار مختلف عن نوع أو لون الأوردر. متأكد أن ده الصنف الذي اتقص فعليًا؟'))return;
  if(!confirm(`سيتم خصم ${sheets} فرخ من ${o.paperLabelFull} وتسجيل التكلفة على الأوردر بدون تغيير حالته الحالية. تنفيذ؟`))return;
  healthPaperRepairSaving=true;$('healthPaperSave').disabled=true;$('healthPaperSave').textContent='جاري الإصلاح...';
  try{
    const d=await authFetch('/system-health-paper-repair/'+healthPaperRepairOrderId,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paper_id:Number(o.paperId),layout_key:o.layoutKey,sheets,confirm_below_plan:below?1:0,confirm_mismatch:mismatch?1:0})});
    healthPaperRepairSaving=false;$('healthPaperSave').textContent='تأكيد الإصلاح والخصم';closeHealthPaperRepair();await runHealthCheck();alert(d.message||'تم إصلاح خصم الورق بنجاح.');
  }catch(e){healthPaperRepairSaving=false;$('healthPaperSave').textContent='تأكيد الإصلاح والخصم';renderHealthPaperPreview();alert(e.message||'تعذر تنفيذ الإصلاح');}
}

اترحّل للموقع: ${d.published||0}`);
    await loadStoreLinkStatus();
  }catch(e){alert(e.message||'تعذر ترقيم وترحيل الأوردرات القديمة');}
}
async function saveStoreLinkSettings(){
  const base_url=$('storeLinkBaseUrl')?.value.trim()||'',integration_key=$('storeLinkKey')?.value.trim()||'',enabled=$('storeLinkEnabled')?.value==='1'?1:0;
  if(!base_url)return alert('اكتب رابط موقع البيع');
  try{const d=await authFetch('/store-sync-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({base_url,integration_key,enabled})});if(d.remote?.error)alert('تم الحفظ، لكن اختبار الاتصال رجع: '+d.remote.error);else alert('تم حفظ إعدادات الربط واختبار الاتصال بنجاح ✅');await loadStoreLinkStatus();}
  catch(e){alert(e.message||'تعذر حفظ إعدادات الربط');}
}

// ---------------- تطبيق الموبايل ----------------
let appLinkStatus=null;
function renderMobileAppPanel(){
  const a=appLinkStatus||{};
  const ok=Boolean(a.configured);
  return `<div class="panel" id="mobile-app-panel">
    <div class="section-title"><div><h2 style="margin:0">📱 لينك تحميل التطبيق</h2><div class="muted">حط لينك تحميل مباشر للـ APK. زرار «تحميل التطبيق» في لوحة التحكم هيبدأ التحميل على طول.</div></div>
    <span class="pill" style="${ok?'color:#34d399':'color:#fbbf24'}">${ok?'اللينك شغال':'لسه مش متظبط'}</span></div>
    <div class="card" style="margin-top:12px"><div class="form-grid">
      <div style="grid-column:1/-1"><label>لينك تحميل الـ APK</label><input id="appUrl" dir="ltr" placeholder="https://..." value="${esc(a.rawUrl||'')}"></div>
      <div><label>رقم الإصدار (اختياري)</label><input id="appVersion" dir="ltr" placeholder="مثال: v1.4.2" value="${esc(a.version||'')}"></div>
      <div><label>اسم الزرار</label><input id="appLabel" placeholder="تحميل التطبيق" value="${esc(a.label||'تحميل التطبيق')}"></div>
      <div class="actions"><button onclick="saveAppLink()">💾 حفظ اللينك</button>${ok?`<a class="btn dark" href="/app-download" target="_blank" rel="noopener">🔽 جرّب التحميل</a>`:''}</div>
    </div>
    <div class="hint" style="margin-top:12px">
      • لو اللينك من <b>Google Drive</b> أو <b>Dropbox</b> الصق لينك المشاركة عادي — السيستم بيحوّله لتحميل مباشر لوحده.<br>
      • لو الملف على GitHub Releases الصق لينك الـ asset مباشرة.<br>
      • أي إصدار جديد: ارفع الـ APK في نفس المكان وغيّر اللينك هنا بس، من غير رفع المشروع.
      ${ok&&a.url&&a.url!==a.rawUrl?`<br>• لينك التحميل المباشر المستخدم فعليًا: <span dir="ltr" style="color:#93c5fd">${esc(a.url)}</span>`:''}
    </div></div>
  </div>`;
}
async function loadAppLink(){
  try{const d=await authFetch('/quick-links');appLinkStatus=d.app||null;if(activeSection==='mobileapp')renderContent();}
  catch(e){appLinkStatus=null;}
}
async function saveAppLink(){
  const url=$('appUrl')?.value.trim()||'';
  const version=$('appVersion')?.value.trim()||'';
  const label=$('appLabel')?.value.trim()||'تحميل التطبيق';
  try{
    const d=await authFetch('/app-download-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,version,label})});
    appLinkStatus=d.app||null;
    alert(url?'تم حفظ لينك التطبيق ✅':'تم مسح لينك التطبيق');
    renderContent();
  }catch(e){alert(e.message||'تعذر حفظ اللينك');}
}

function renderContent(){
  renderStats();
  const info=sectionInfo[activeSection]||sectionInfo.security;
  let html=`<div class="panel"><div class="section-title"><div><h2 style="margin:0">${esc(info.title)}</h2><div class="muted">${esc(info.desc)}</div></div><span class="pill">${activeSection==='all'?'عرض شامل':'قسم منفصل'}</span></div></div>`;
  const settingCats=Object.prototype.hasOwnProperty.call(info,'settings')?info.settings:null;
  if(settingCats===null||(Array.isArray(settingCats)&&settingCats.length)) html+=renderSettingsPanel(settingCats);
  if(activeSection==='health') html+=renderHealthPanel();
  if(activeSection==='storelink') html+=renderStoreLinkPanel();
  if(activeSection==='mobileapp') html+=renderMobileAppPanel();
  html+=renderBostaIntro();
  const types=typesForCurrentSection();
  if(types.length) html+=types.map(renderCatalogCard).join('');
  if(!types.length && !['security','pricing','health','storelink','mobileapp'].includes(activeSection)) html+='<div class="panel muted">لا توجد قوائم في هذا القسم.</div>';
  $('content').innerHTML=html;
}
function startNewItem(type){
  $('itemId').value='';$('itemType').value=type;$('itemName').value='';$('itemCode').value='';$('itemSort').value='0';$('itemActive').value='1';$('itemExtra').value='';
  $('editTitle').textContent='إضافة عنصر — '+labelType(type);$('editSub').textContent='الاسم يظهر في السيستم، والكود يستخدم للربط الخارجي لو موجود.';$('editBox').classList.remove('hidden');$('itemName').focus();window.scrollTo({top:$('editBox').offsetTop-10,behavior:'smooth'});
}
function hideItemForm(){$('editBox').classList.add('hidden');}
function editItem(id){
  const r=activeCatalogs().find(x=>Number(x.id)===Number(id));if(!r)return;
  $('itemId').value=r.id;$('itemType').value=r.catalog_type;$('itemName').value=r.name||'';$('itemCode').value=r.code||'';$('itemSort').value=r.sort_order||0;$('itemActive').value=Number(r.is_active||0)?'1':'0';$('itemExtra').value=r.extra_json||'';
  $('editTitle').textContent='تعديل عنصر — '+labelType(r.catalog_type);$('editSub').textContent='رقم العنصر #'+r.id;$('editBox').classList.remove('hidden');window.scrollTo({top:$('editBox').offsetTop-10,behavior:'smooth'});
}
async function saveSetting(key){const el=$('setting_'+key);if(!el)return;await authFetch('/system-setting',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({setting_key:key,setting_value:el.value})});await loadAll();alert('تم حفظ الإعداد');}
async function saveItem(){
  const type=$('itemType').value.trim();
  if(!type)return alert('اختار نوع القائمة');
  if(!$('itemName').value.trim())return alert('اكتب الاسم');
  if($('itemExtra').value.trim()){try{JSON.parse($('itemExtra').value)}catch(e){return alert('بيانات JSON غير صحيحة');}}
  await authFetch('/system-catalog-item',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('itemId').value||undefined,catalog_type:type,name:$('itemName').value.trim(),code:$('itemCode').value.trim(),sort_order:$('itemSort').value||0,is_active:$('itemActive').value,extra_json:$('itemExtra').value.trim()})});
  hideItemForm();await loadAll();
}
async function deleteItem(id){if(!confirm('إيقاف العنصر؟ السجلات القديمة لن تتأثر.'))return;await authFetch('/system-catalog-item/'+id,{method:'DELETE'});await loadAll();}
async function createZoneTypeForGov(){
  const gov=$('newZoneGov')?.value||'';if(!gov)return alert('اختار المحافظة');
  const type='bosta_zones:'+gov;
  if(!activeCatalogs().some(i=>i.catalog_type===type)){
    await authFetch('/system-catalog-item',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({catalog_type:type,name:'منطقة جديدة',code:'',sort_order:999,is_active:0,extra_json:'{}'})});
  }
  await loadAll();setSection('bosta');setTimeout(()=>{const id='card_'+type.replace(/[^\w\u0600-\u06FF-]/g,'_');const el=$(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},50);
}
async function loadAll(){data=await authFetch('/system-config-data');data.settings=data.settings||[];data.catalogs=data.catalogs||[];data.active_users=data.active_users||[];if(location.hash==='#store-link')activeSection='storelink';if(location.hash==='#mobile-app')activeSection='mobileapp';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.section===activeSection));renderContent();if(activeSection==='storelink')loadStoreLinkStatus();loadAppLink();}
loadAll().catch(e=>alert(e.message||'حدث خطأ'));
</script>
